<div class="min-h-screen bg-slate-50">
  <!-- Navigation -->
  <nav class="bg-gradient-to-r from-indigo-600 to-purple-600 shadow-lg">
    <div class="container mx-auto px-6 py-4">
      <div class="flex items-center justify-between">
        <h1 class="text-xl font-bold text-white tracking-wide flex items-center gap-2">
          <i class="fa-solid fa-robot"></i> AI Tools
        </h1>
        <div class="flex gap-2">
          <button 
            (click)="setTab('articles')"
            [class]="getCurrentTab() === 'articles' 
              ? 'bg-white text-indigo-700 shadow-md' 
              : 'bg-white/15 text-white hover:bg-white/25'"
            class="px-5 py-2 rounded-lg font-medium transition-all duration-200 flex items-center gap-2"
          >
            <i class="fa-solid fa-newspaper"></i> Articles
          </button>
          <button 
            (click)="setTab('images')"
            [class]="getCurrentTab() === 'images' 
              ? 'bg-white text-indigo-700 shadow-md' 
              : 'bg-white/15 text-white hover:bg-white/25'"
            class="px-5 py-2 rounded-lg font-medium transition-all duration-200 flex items-center gap-2"
          >
            <i class="fa-solid fa-image"></i> Images
          </button>
        </div>
      </div>
    </div>
  </nav>

  <!-- Content -->
  <main>
    <router-outlet />
  </main>
</div>
